[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ['dist/.*', 'build/.*', '\.venv/.*']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP"]
ignore = ["B008", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "client"]